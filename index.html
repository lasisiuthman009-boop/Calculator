<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <title>Calculator</title>
</head>

<body>

    <div class="calculator">
      <input type="text" readonly id="result">

      <div class="keys">
       <button onclick="appendDisplay('7')" class="num">7</button>
       <button onclick="appendDisplay('8')" class="num">8</button>
       <button onclick="appendDisplay('9')" class="num">9</button>
       <button onclick="appendDisplay('-')" class="operator">-</button>
       <button onclick="appendDisplay('4')" class="num">4</button>
       <button onclick="appendDisplay('5')" class="num">5</button>
       <button onclick="appendDisplay('6')" class="num">6</button>
       <button onclick="appendDisplay('*')" class="operator">*</button>
       <button onclick="appendDisplay('1')" class="num">1</button>
       <button onclick="appendDisplay('2')" class="num">2</button>
       <button onclick="appendDisplay('3')" class="num">3</button>
       <button onclick="appendDisplay('/')" class="operator">/</button>
       <button onclick="appendDisplay('0')" class="num">0</button>
       <button onclick="appendDisplay('.')" class="num">.</button>
       <button onclick="calculate()" class="equalTo">=</button>
       <button onclick="clearDisplay()" id="clear" class="operator">C</button>



      </div>



    </div>

    





    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
